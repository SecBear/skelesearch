[workspace]
members = ["crates/core", "crates/embed-fastembed", "crates/mcp", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["bear <bear@golden-neuron.dev>"]
homepage = "https://github.com/golden-neuron/skelesearch"
repository = "https://github.com/golden-neuron/skelesearch"

[workspace.dependencies]
# Storage
# Default: storage-sqlite (fast compile, persistent, full feature parity for dev)
# Release: override in crate Cargo.toml with features = ["storage-rocksdb"]
# or: cargo build --features skelesearch-core/storage-rocksdb
cozo = { version = "0.7.6", default-features = false, features = [
   "storage-sqlite",
   "rayon",
] }
rusqlite = { version = "0.31", features = ["bundled"] }

# Tree-sitter
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-nix = "0.3"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-kotlin-sg = "0.4"
tree-sitter-swift = "0.7"
tree-sitter-scala = "0.25"

# Chunking
text-splitter = { version = "0.29", features = ["code"] }

# Hashing & walking
twox-hash = "2"
ignore = "0.4"
ndarray = { version = "0.15", features = ["serde"] }

# Embedding
fastembed = { version = "4" }

# MCP server
rmcp = { version = "0.16", features = ["server", "transport-io", "macros"] }
schemars = "1"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "2"

# File watching (optional)
notify = { version = "6" }
notify-debouncer-full = { version = "0.3" }

chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fs2 = "0.4"
regex = "1"
toml = "0.8"

# Patch: redirect sqlite3-sys to a local shim that omits `links = "sqlite3"`.
# This allows cozo (via sqlite→sqlite3-sys) and rusqlite (via libsqlite3-sys)
# to coexist in the same binary — libsqlite3-sys (bundled) owns the native
# library and satisfies the extern "C" declarations in the shim at link time.
[patch.crates-io]
sqlite3-sys = { path = "vendor/sqlite3-sys" }
