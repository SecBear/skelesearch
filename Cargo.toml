[workspace]
members = [
   "crates/core",
   "crates/service",
   "crates/daemon",
   "crates/embed-fastembed",
   "crates/embed-openai",
   "crates/embed-voyage",
   "crates/mcp",
   "crates/cli",
   "crates/rerank-api",
   "crates/telemetry",
   "crates/rerank-local",
   "crates/rerank-qwen3",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["bear <bear@golden-neuron.dev>"]
homepage = "https://github.com/SecBear/skelesearch"
repository = "https://github.com/SecBear/skelesearch"

[workspace.dependencies]
# Composite backend: LanceDB (vector + relational), Tantivy (BM25 FTS), petgraph (graph analytics)
lancedb = "0.27"
tantivy = "0.25"
petgraph = { version = "0.8", features = ["serde-1"] }
arrow-array = "57"
arrow-schema = "57"
arrow-cast = "57"
futures = "0.3"

# rusqlite is used by ManifestStore (flat SQLite manifest, not migrated).
# CozoDB removed; the sqlite3-sys shim is no longer needed.
rusqlite = { version = "0.38", features = ["bundled"] }

# Tree-sitter
tree-sitter = "0.26"
tree-sitter-tags = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-nix = "0.3"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-kotlin-sg = "0.4"
tree-sitter-swift = "0.7"
tree-sitter-scala = "0.25"

# Chunking
text-splitter = { version = "0.29", features = ["code"] }

# Hashing & walking
twox-hash = "2"
ignore = "0.4"
ndarray = { version = "0.15", features = ["serde"] }

# Embedding
reqwest = { version = "0.12", features = [
   "json",
   "rustls-tls",
], default-features = false }

hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }

fastembed = { version = "5", default-features = false, features = [
   "ort-download-binaries-native-tls",
   "hf-hub-native-tls",
] }

# MCP server
rmcp = { version = "1.2", features = [
   "server",
   "transport-io",
   "transport-streamable-http-server",
   "macros",
] }
schemars = "1"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "2"

# File watching (optional)
notify = { version = "6" }
notify-debouncer-full = { version = "0.3" }

chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fs2 = "0.4"
regex = "1"
toml = "0.8"
