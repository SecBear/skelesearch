[package]
name = "skelesearch-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tracing + OpenTelemetry setup for skelesearch binaries"

[features]
default = []
otlp = [
   "dep:opentelemetry",
   "dep:opentelemetry_sdk",
   "dep:opentelemetry-otlp",
   "dep:tracing-opentelemetry",
]

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
tracing-appender = "0.2"
anyhow = { workspace = true }

# Optional: OpenTelemetry OTLP export (feature-gated)
opentelemetry = { version = "0.29", optional = true }
opentelemetry_sdk = { version = "0.29", features = [
   "rt-tokio",
], optional = true }
opentelemetry-otlp = { version = "0.29", features = [
   "grpc-tonic",
], optional = true }
tracing-opentelemetry = { version = "0.30", optional = true }
