[package]
name = "skelesearch-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server for skelesearch — exposes semantic code search as MCP tools"

[lib]
name = "skelesearch_mcp"
path = "src/lib.rs"

[[bin]]
name = "skelesearch-mcp"
path = "src/main.rs"

[features]
default = []
storage-rocksdb = ["skelesearch-core/storage-rocksdb"]
local-reranker = ["dep:skelesearch-rerank-local"]
coreml = ["local-reranker", "skelesearch-rerank-local/coreml"]
cuda = ["local-reranker", "skelesearch-rerank-local/cuda"]
qwen3 = ["dep:skelesearch-rerank-qwen3"]

[dependencies]
skelesearch-core = { path = "../core" }
skelesearch-service = { path = "../service" }
skelesearch-embed-fastembed = { path = "../embed-fastembed" }
skelesearch-embed-openai = { path = "../embed-openai" }
skelesearch-rerank-api = { path = "../rerank-api" }
skelesearch-rerank-local = { path = "../rerank-local", optional = true }
skelesearch-rerank-qwen3 = { path = "../rerank-qwen3", optional = true }
rmcp = { workspace = true }
clap = { workspace = true }
axum = { version = "0.8", default-features = false, features = [
   "http1",
   "tokio",
] }
schemars = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
tracing-subscriber = { workspace = true }
skelesearch-telemetry = { path = "../telemetry" }
sysinfo = "0.30"

[dev-dependencies]
tempfile = { workspace = true }
