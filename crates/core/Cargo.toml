[package]
name = "skelesearch-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for skelesearch: schema, indexer, searcher, chunker, manifest"

[features]
default = []
watch = ["notify", "notify-debouncer-full"]

[dependencies]
rusqlite = { workspace = true }
# Composite backend
lancedb = { workspace = true }
tantivy = { workspace = true }
petgraph = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
arrow-cast = { workspace = true }
futures = { workspace = true }

tree-sitter = { workspace = true }
tree-sitter-tags = { workspace = true }
streaming-iterator = "0.1"
tree-sitter-rust = { workspace = true }
tree-sitter-nix = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-ruby = { workspace = true }
tree-sitter-php = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-kotlin-sg = { workspace = true }
tree-sitter-swift = { workspace = true }
tree-sitter-scala = { workspace = true }

text-splitter = { workspace = true }
twox-hash = { workspace = true }
ignore = { workspace = true }
ndarray = { workspace = true }

tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

notify = { workspace = true, optional = true }
notify-debouncer-full = { workspace = true, optional = true }

chrono = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
lru = "0.12"
fs2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
