[package]
name = "skelesearch-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local singleton daemon skeleton for skelesearch"

[lib]
name = "skelesearch_daemon"
path = "src/lib.rs"

[[bin]]
name = "skelesearchd"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
fs2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
skelesearch-core = { path = "../core" }
skelesearch-embed-fastembed = { path = "../embed-fastembed" }
skelesearch-telemetry = { path = "../telemetry" }
skelesearch-service = { path = "../service" }

[dev-dependencies]
tempfile = { workspace = true }
