[package]
name = "skelesearch-rerank-local"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local ONNX cross-encoder reranker for skelesearch"

[dependencies]
skelesearch-core = { path = "../core" }
ort = { version = "=2.0.0-rc.11", default-features = false, features = [
   "ndarray",
] }
ndarray = "0.17" # must match ort's ndarray; workspace uses 0.15 for CozoDB compat
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
async-trait = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
