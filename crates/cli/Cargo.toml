[package]
name = "skelesearch-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for skelesearch — index, search, context, status, clear, watch"

[[bin]]
name = "skelesearch"
path = "src/main.rs"

[features]
watch = ["skelesearch-core/watch"]
local-reranker = ["dep:skelesearch-rerank-local"]
coreml = ["local-reranker", "skelesearch-rerank-local/coreml"]
cuda = ["local-reranker", "skelesearch-rerank-local/cuda"]
qwen3 = ["dep:skelesearch-rerank-qwen3"]

[dependencies]
skelesearch-core = { path = "../core" }
skelesearch-embed-fastembed = { path = "../embed-fastembed" }
skelesearch-embed-openai = { path = "../embed-openai" }
skelesearch-rerank-api = { path = "../rerank-api" }
skelesearch-rerank-local = { path = "../rerank-local", optional = true }
skelesearch-rerank-qwen3 = { path = "../rerank-qwen3", optional = true }
clap = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
skelesearch-telemetry = { path = "../telemetry" }
fs2 = { workspace = true }

notify = { workspace = true }
notify-debouncer-full = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
serde_json = { workspace = true }
