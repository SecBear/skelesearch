[package]
name = "sqlite3-sys"
version = "0.15.2"
edition = "2021"
description = "Local shim: exposes sqlite3-sys FFI surface without declaring links=sqlite3, allowing rusqlite's libsqlite3-sys (bundled) to own the native library."
license = "MIT OR Apache-2.0"

# No `links = "sqlite3"` — libsqlite3-sys (from rusqlite, bundled) owns that.
# The extern "C" declarations below resolve at link time against its sqlite3.a.

[dependencies]
libc = "0.2"

# The sqlite crate requires `linkage` and `bundled` features from sqlite3-sys.
# We define them as empty (no deps) so they satisfy the requirement without
# pulling in sqlite3-src. libsqlite3-sys (bundled rusqlite) provides the
# actual sqlite3.a at link time.
[features]
default = ["linkage"]
linkage = []  # empty: no sqlite3-src dep; libsqlite3-sys provides the library
bundled = []

[workspace]
